services:
  router:
    image: alpine
    command: sh -c "apk add --no-cache iptables tcpdump && sleep infinity"
    cap_add: [NET_ADMIN]
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      net_a:
        ipv4_address: 10.10.1.254
      net_b:
        ipv4_address: 10.10.2.254
      net_ext: {}

  client:
    image: alpine
    cap_add: [NET_ADMIN]
    command: sh -c "ip route add 10.10.2.0/24 via 10.10.1.254 && sleep infinity"
    networks:
      net_a:
        ipv4_address: 10.10.1.10

  server:
    image: nginx:alpine
    cap_add: [NET_ADMIN]
    command: sh -c "ip route add 10.10.1.0/24 via 10.10.2.254 && nginx -g 'daemon off;'"
    networks:
      net_b:
        ipv4_address: 10.10.2.10

networks:
  net_a:
    ipam:
      config: [{subnet: 10.10.1.0/24}]
  net_b:
    ipam:
      config: [{subnet: 10.10.2.0/24}]
  net_ext: {}